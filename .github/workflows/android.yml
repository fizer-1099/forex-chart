name: Android APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'capacitor.config.json', 'package.json', 'tools/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Bundle chart library (offline, faster start)
        run: |
          npm install --no-save --no-audit --no-fund lightweight-charts@4.1.3 || true
          F=node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js
          if [ -f "$F" ]; then cp "$F" app/lw.js && node tools/vendor-lw.js app/index.html; else echo "chart library not found; using CDN"; fi
      - run: npx cap add android && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest android/app/build/outputs/apk/debug/app-debug.apk --title "Latest APK" --notes "Auto build ${{ github.sha }}"

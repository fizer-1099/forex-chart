name: Windows App
on:
  push:
    branches: [main]
    paths: ['app/**', 'desktop/**', 'tools/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare app files
        shell: bash
        run: |
          mkdir -p desktop/app
          cp -r app/. desktop/app/
          rm -f desktop/app/sw.js
      - name: Install desktop dependencies
        shell: bash
        run: |
          cd desktop
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund lightweight-charts@4.1.3
          cp node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js app/lw.js
          node ../tools/vendor-lw.js app/index.html
      - name: Build portable exe
        shell: bash
        run: cd desktop && npm run dist
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-windows --yes --cleanup-tag || true
          gh release create latest-windows desktop/dist/ForexChart-Windows.exe --title "Latest Windows app" --notes "Auto build ${{ github.sha }}"

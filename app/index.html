<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111418">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forex Chart</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b7280;--bd:#e5e7eb;--up:#16a34a;--dn:#dc2626;--ac:#2563eb;--grid:#f0f0f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--fg:#e8e8e8;--mut:#9aa3af;--bd:#2a2f36;--up:#22c55e;--dn:#f87171;--ac:#60a5fa;--grid:#1c2127;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--fg:#e8e8e8;--mut:#9aa3af;--bd:#2a2f36;--up:#22c55e;--dn:#f87171;--ac:#60a5fa;--grid:#1c2127;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;display:flex;flex-direction:column;font-size:13px}
.bar{display:flex;gap:5px;padding:6px 8px;border-bottom:1px solid var(--bd);overflow-x:auto;flex:none;align-items:center}
button,select,input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:5px 9px;white-space:nowrap}
input[type=number]{width:62px}input[type=color]{width:36px;padding:1px;height:30px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.35}
.buy{color:var(--up);border-color:var(--up)}.sell{color:var(--dn);border-color:var(--dn)}
#info{padding:4px 10px;color:var(--mut);font-size:12px;direction:ltr;text-align:left;flex:none;min-height:16px}
#chart{flex:1;min-height:150px}
.pn{display:none;flex:none;max-height:42vh;overflow-y:auto;border-top:1px solid var(--bd);padding:8px;gap:8px;flex-direction:column}
.pn.show{display:flex}
.row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:3px 5px;border-bottom:1px solid var(--bd);text-align:center}
.p{color:var(--up)}.n{color:var(--dn)}
input[type=file]{display:none}
#dlg{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 20px}#dlg h4{margin:14px 0 4px;border-bottom:1px solid var(--bd);padding-bottom:4px}#dlg label{padding:6px 0}
#sym{display:none;position:fixed;top:0;bottom:0;right:0;width:min(72vw,320px);z-index:60;background:var(--bg);border-left:1px solid var(--bd);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);box-shadow:-4px 0 16px #0004}.sy{padding:16px 18px;border-bottom:1px solid var(--bd);direction:ltr;text-align:left;font-size:15px}.sy.on{color:var(--ac);font-weight:700}#toast{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;z-index:90;background:#f59e0b;color:#000;padding:10px;border-radius:10px;text-align:center;font-weight:600}.tl{display:block;width:100%;text-align:start;margin:4px 0;padding:12px}
#split{display:none;flex:none;height:30px;align-items:center;justify-content:center;background:var(--bd);touch-action:none;cursor:ns-resize}#split div{width:48px;height:4px;border-radius:2px;background:var(--mut)}
#tfs,#tools{display:none}#top{justify-content:space-between;gap:4px}#top button{padding:6px 9px;font-size:14px}#tfb{font-weight:700}#trd{display:none;flex:none;border-top:1px solid var(--bd);padding:8px;background:var(--bg);max-height:36vh;overflow-y:auto}#trd .row{margin-bottom:6px}.circ{width:42px;height:42px;border-radius:50%;padding:0;font-weight:700}.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tg button{padding:12px 4px}.sb{flex:1;color:#fff;border:0;padding:8px;font-weight:700;border-radius:10px;line-height:1.25}
.fs #top,.fs #tfs,.fs #tools{display:none}.wr{display:flex;justify-content:space-between;padding:14px 8px;border-bottom:1px solid var(--bd)}.wr>*{flex:1;text-align:center}
</style>
</head>
<body>
<div class="bar" id="top"></div>
<div class="bar" id="tfs"></div>
<div class="bar" id="tools">
<button id="symb">EURUSD ▾</button>
<button id="gob">⇥</button>
<button id="xhb">✛</button>
<button data-p="al">هشدار</button>
<button data-p="ma">اندیکاتور</button>
<button data-p="dr">ترسیم</button>
<button id="lvl">+ سطح</button>
<button id="clr">پاک‌کردن سطوح</button>
<button id="csvb">CSV</button>
<button id="apib">دیتای زنده API</button>
<button data-p="rp">Replay</button>
<button data-p="jr">ژورنال</button>
<button data-p="rk">ریسک</button>
<input type="file" id="csv" accept=".csv,.txt">
</div>
<div id="info"></div>
<div id="chart"></div>
<div id="split"><div></div></div>
<div id="oscs" style="flex:none;display:flex;flex-direction:column;height:0"></div>
<div id="trd"></div>

<div class="pn" id="ma">
<div id="malist" class="row" style="flex-direction:column;align-items:stretch"></div>
<div class="row">
<select id="mt"><option>SMA</option><option>EMA</option><option>WMA</option></select>
<input id="mn" type="number" value="100" min="1" max="1000">
<select id="ms"><option value="close">Close</option><option value="open">Open</option><option value="high">High</option><option value="low">Low</option><option value="hl2">HL2</option></select>
<input id="mc" type="color" value="#06b6d4">
<button id="madd">+ افزودن</button></div><div class="row" id="inds"><button data-i="ichi">Ichimoku</button><button data-i="bb">Bollinger</button><button data-i="rsi">RSI</button><button data-i="macd">MACD</button><button data-i="stoch">Stoch</button><button data-i="atr">ATR</button>
</div>
</div>

<div class="pn" id="al"></div>
<div class="pn" id="dr"></div>
<div class="pn" id="rp">
<div class="row"><button id="rstart">شروع Replay</button><span class="mut">شروع از</span><input id="rpos" type="range" min="5" max="95" value="70" style="width:90px"><span id="rpv" class="mut">70%</span></div>
<div class="row"><button id="rplay" disabled>▶</button><button id="rstep" disabled>کندل بعد ⏭</button>
<select id="rspd"><option value="1000">کند</option><option value="400" selected>متوسط</option><option value="120">سریع</option></select></div>
<div class="row"><span class="mut">لات</span><input id="lot" type="number" value="0.1" step="0.01"><span class="mut">SL پیپ</span><input id="slp" type="number" value="20"><span class="mut">TP پیپ</span><input id="tpp" type="number" value="40"></div>
<div class="row" style="display:none"><button class="buy" id="rbuy" disabled>خرید</button><button class="sell" id="rsell" disabled>فروش</button><button id="rclose" disabled>بستن</button></div>
<div id="rst" class="mut"></div>
</div>

<div class="pn" id="jr">
<div id="jst" class="mut"></div><div id="jeq"></div>
<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>نوع</th><th>ورود</th><th>خروج</th><th>پیپ</th><th>سود</th><th>📝</th></tr></thead><tbody id="jtb"></tbody></table></div>
<div class="row"><button id="jclr">پاک‌کردن ژورنال</button></div>
</div>

<div class="pn" id="rk">
<div class="row"><span class="mut">سرمایه</span><input id="bal" type="number" value="10000" style="width:80px"><span class="mut">ریسک ٪</span><input id="rkp" type="number" value="1" step="0.1"><span class="mut">SL پیپ</span><input id="rks" type="number" value="20"></div>
<div id="rkout" style="font-weight:600"></div>
<div class="row"><button id="rkuse">استفاده در Replay</button></div>
<div class="row"><span class="mut">سقف ضرر روزانه ٪</span><input id="dlim" type="number" value="2" step="0.5"><span class="mut">(در Replay با رسیدن به سقف، معامله جدید قفل می‌شود)</span></div>
<div class="mut">ارزش هر پیپ برای جفت‌ارزهای با USD در ابتدا، حدود ۱۰ دلار به ازای هر لات فرض شده است.</div>
</div>

<div id="sym"></div><div id="toast"></div>
<div id="dlg"></div>
<div id="errb" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:99;background:#7f1d1d;color:#fff;font:12px monospace;padding:8px;direction:ltr;max-height:30vh;overflow:auto"></div>
<script>window.addEventListener('error',e=>{const b=document.getElementById('errb');b.style.display='block';b.textContent+=(e.message||'error')+' @'+(e.lineno||'')+'\n'});window.addEventListener('unhandledrejection',e=>{const b=document.getElementById('errb');b.style.display='block';b.textContent+='promise: '+(e.reason&&e.reason.message||e.reason)+'\n'})</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<script>window.LightweightCharts||document.write('<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"><\/script>')</script>
<script>if(!window.LightweightCharts){const b=document.getElementById('errb');b.style.display='block';b.textContent='کتابخانه نمودار بارگذاری نشد؛ اینترنت را بررسی کنید.'}</script>
<script>
const $=id=>document.getElementById(id);
const TF=[['S30',30],['M1',60],['M2',120],['M3',180],['M4',240],['M5',300],['M6',360],['M10',600],['M12',720],['M15',900],['M20',1200],['M30',1800],['H1',3600],['H2',7200],['H3',10800],['H4',14400],['H6',21600],['H8',28800],['H12',43200],['D1',86400],['W1','W'],['MN','M']];
let base=[],baseSec=30,tf=300,R=[],D=[],levels=[],lvlMode=false,mas=[],trades=[];
const rp={on:false,i:0,pos:null,timer:null};
try{trades=JSON.parse(localStorage.getItem('fx_trades')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('fx_trades',JSON.stringify(trades))}catch(e){}};

function sample(){
  let s=42;const r=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;
  let p=1.0850,t=Math.floor(Date.now()/30000)*30-30*2880*28,out=[];
  for(let i=0;i<2880*28;i++,t+=30){
    const d=new Date(t*1000).getUTCDay();if(d==0||d==6)continue;
    const o=p;let h=o,l=o,c=o;
    for(let k=0;k<3;k++){c+=(r()-0.5)*0.00007+Math.sin(i/3000)*0.000002;h=Math.max(h,c);l=Math.min(l,c)}
    out.push({time:t,open:o,high:h,low:l,close:c});p=c;
  }
  return out;
}
const key=(t,s)=>s==='W'?Math.floor((t+259200)/604800)*604800-259200:s==='M'?(d=>Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)/1000)(new Date(t*1000)):Math.floor(t/s)*s;
function resample(s){
  const out=[];let c=null;
  for(let j=0;j<base.length;j++){const b=base[j],k=key(b.time,s);
    if(!c||c.time!==k){c&&out.push(c);c={time:k,open:b.open,high:b.high,low:b.low,close:b.close,fi:j,li:j}}
    else{if(b.high>c.high)c.high=b.high;if(b.low<c.low)c.low=b.low;c.close=b.close;c.li=j}}
  c&&out.push(c);return out;
}
function aggBar(b0,e){let h=-1e9,l=1e9;for(let j=b0.fi;j<=e;j++){if(base[j].high>h)h=base[j].high;if(base[j].low<l)l=base[j].low}return{time:b0.time,open:b0.open,high:h,low:l,close:base[e].close,fi:b0.fi,li:e}}
function findK(i){let a=0,b=R.length-1;while(a<b){const m=(a+b)>>1;if(R[m].li>=i)b=m;else a=m+1}return a}

// اندیکاتورها
const srcv=(b,s)=>s==='hl2'?(b.high+b.low)/2:b[s];
function maSeries(d,m){
  const n=m.n,v=d.map(b=>srcv(b,m.src)),o=[];
  if(m.type==='EMA'){const a=2/(n+1);let e=v[0];for(let i=0;i<v.length;i++){e=i?a*v[i]+(1-a)*e:v[0];if(i>=n-1)o.push({time:d[i].time,value:e})}}
  else if(m.type==='WMA'){const den=n*(n+1)/2;for(let i=n-1;i<v.length;i++){let s=0;for(let k=0;k<n;k++)s+=v[i-n+1+k]*(k+1);o.push({time:d[i].time,value:s/den})}}
  else{let s=0;for(let i=0;i<v.length;i++){s+=v[i];if(i>=n)s-=v[i-n];if(i>=n-1)o.push({time:d[i].time,value:s/n})}}
  return o;
}
function addMA(type,n,src,color){
  const m={id:Date.now()+Math.random(),type,n,src,color,on:true};
  m.series=chart.addLineSeries({color,lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
  mas.push(m);m.series.setData(maSeries(D,m));listMA();
}
function listMA(){saveState();
  $('malist').innerHTML='';
  mas.forEach(m=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML=`<span style="color:${m.color}">●</span><span>${m.type} ${m.n} · ${m.src}</span>`;
    const t=document.createElement('button');t.textContent=m.on?'روشن':'خاموش';t.className=m.on?'on':'';
    t.onclick=()=>{m.on=!m.on;m.series.applyOptions({visible:m.on});listMA()};
    const x=document.createElement('button');x.textContent='حذف';
    x.onclick=()=>{chart.removeSeries(m.series);mas=mas.filter(z=>z!==m);listMA()};
    r.append(t,x);$('malist').appendChild(r);
  });
}
$('madd').onclick=()=>{const n=Math.max(1,Math.min(1000,+$('mn').value||20));addMA($('mt').value,n,$('ms').value,$('mc').value)};
function stepMAs(){
  mas.forEach(m=>{const tail=D.slice(-(m.n*5+5));const s=maSeries(tail,m);if(s.length)m.series.update(s[s.length-1])});
}

// نمودار
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const chart=LightweightCharts.createChart($('chart'),{autoSize:true,handleScroll:{vertTouchDrag:true},crosshair:{mode:0},timeScale:{timeVisible:true,secondsVisible:true,rightOffset:5},rightPriceScale:{borderVisible:false,minimumWidth:64}});
const candles=chart.addCandlestickSeries({priceFormat:{type:'price',precision:5,minMove:0.00001}});
const SET=(()=>{try{return JSON.parse(localStorage.getItem('fx_set'))||{}}catch(e){return{}}})();
if(SET.theme==='light'||SET.theme==='dark')document.documentElement.dataset.theme=SET.theme;
const IND={};
const themeOpts=()=>({layout:{background:{color:css('--bg')},textColor:css('--mut')},grid:{vertLines:{color:css('--grid'),visible:SET.grid!==0},horzLines:{color:css('--grid'),visible:SET.grid!==0}}});
function theme(){
  chart.applyOptions(themeOpts());Object.values(IND).forEach(x=>x.el&&x.ch.applyOptions(themeOpts()));
  candles.applyOptions({upColor:SET.up||css('--up'),downColor:SET.dn||css('--dn'),wickUpColor:SET.up||css('--up'),wickDownColor:SET.dn||css('--dn'),borderVisible:false});
}
theme();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);

function render(fit){
  R=resample(tf);
  if(rp.on){const k=findK(rp.i);D=R.slice(0,k+1);D[k]=aggBar(R[k],rp.i)}else D=R;
  candles.setData(dispData(D));applyCT();mas.forEach(m=>m.series.setData(maSeries(D,m)));Object.keys(IND).forEach(calcInd);
  if(fit)goLast();
  $('info').textContent=D.length+' candles';badge();
}
const bar=$('tfs');
TF.forEach(([n,s])=>{const b=document.createElement('button');b.textContent=n;b.dataset.s=s;
  b.onclick=()=>{tf=isNaN(+s)?s:+s;syncTF();if(!autoBase(tf))render(true)};bar.appendChild(b)});
function syncTF(){[...bar.children].forEach(b=>{const s=isNaN(+b.dataset.s)?b.dataset.s:+b.dataset.s;b.disabled=typeof s==='number'&&(LIVEMODE()?(s<60&&!SRV):s<baseSec);b.className=s===tf?'on':''});const cb=[...bar.children].find(b=>b.className==='on');if(cb&&$('tfb'))$('tfb').textContent=cb.textContent}

$('lvl').onclick=e=>{lvlMode=!lvlMode;e.target.classList.toggle('on',lvlMode)};
$('clr').onclick=()=>{levels.forEach(l=>candles.removePriceLine(l));levels=[]};
chart.subscribeClick(p=>{if(!lvlMode||!p.point)return;const pr=candles.coordinateToPrice(p.point.y);if(pr==null)return;
  levels.push(candles.createPriceLine({price:pr,color:css('--ac'),lineWidth:1,lineStyle:2,axisLabelVisible:true}))});
chart.subscribeCrosshairMove(p=>{const c=p.seriesData&&p.seriesData.get(candles);if(!c)return;
  $('info').textContent=`O ${c.open.toFixed(5)}  H ${c.high.toFixed(5)}  L ${c.low.toFixed(5)}  C ${c.close.toFixed(5)}`});

// پنل‌ها
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
  const el=$(b.dataset.p),was=el.classList.contains('show');
  document.querySelectorAll('.pn').forEach(p=>p.classList.remove('show'));
  document.querySelectorAll('[data-p]').forEach(x=>x.classList.remove('on'));
  if(!was){el.classList.add('show');b.classList.add('on')}
  if(b.dataset.p==='jr')renderJ();if(b.dataset.p==='rk')calcRisk();
});

// CSV
$('csvb').onclick=()=>$('csv').click();
$('csv').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{
    const rows=[];
    for(const line of String(rd.result).split(/\r?\n/)){
      const c=line.trim().split(/[,;\t]/);if(c.length<5)continue;
      let t=Number(c[0]);
      if(isNaN(t))t=Date.parse(c[0].replace(/\./g,'-').replace(' ','T')+(/[zZ+]/.test(c[0])?'':'Z'))/1000;else if(t>1e11)t=Math.floor(t/1000);
      const o=+c[1],h=+c[2],l=+c[3],cl=+c[4];if(isNaN(t)||isNaN(o)||isNaN(cl))continue;
      rows.push({time:t,open:o,high:h,low:l,close:cl});
    }
    rows.sort((a,b)=>a.time-b.time);
    if(rows.length<10){$('info').textContent='فایل معتبر نبود: time,open,high,low,close';return}
    const df=rows.slice(1,300).map((r,i)=>r.time-rows[i].time).filter(x=>x>0).sort((a,b)=>a-b);
    baseSec=df[df.length>>1]||60;base=rows;stopReplay();SRCL='CSV';
    const dec=DEC=String(rows[0].close).split('.')[1]?.length||5;
    candles.applyOptions({priceFormat:{type:'price',precision:dec,minMove:Math.pow(10,-dec)}});
    if(typeof tf==='number'&&tf<baseSec)tf=baseSec;
    syncTF();render(true);
  };
  rd.readAsText(f);
};

// Replay
const pip=()=>PIP;
const bal0=()=>+$('bal').value||10000;
const day=t=>Math.floor(t/86400);
function startReplay(){
  rp.on=true;rp.pos=null;rp.i=Math.floor(base.length*(+$('rpos').value/100));
  $('rstart').textContent='پایان Replay';['rplay','rstep','rbuy','rsell'].forEach(i=>$(i).disabled=false);
  render(true);status();
}
function stopReplay(){
  clearInterval(rp.timer);rp.timer=null;$('rplay').textContent='▶';
  if(!rp.on)return;rp.on=false;rp.pos=null;
  $('rstart').textContent='شروع Replay';['rplay','rstep','rbuy','rsell','rclose'].forEach(i=>$(i).disabled=true);
  render(true);$('rst').textContent='';
}
$('rstart').onclick=()=>rp.on?stopReplay():startReplay();
$('rpos').oninput=()=>$('rpv').textContent=$('rpos').value+'%';
function step(){
  const k=findK(rp.i),nx=R[k+1];if(!nx){clearInterval(rp.timer);rp.timer=null;$('rplay').textContent='▶';return}
  D[k]=R[k];ctOf()==='heikin'?0:candles.update(R[k]);
  for(let j=rp.i+1;j<=nx.li;j++){rp.i=j;checkPos(base[j]);if(j>0)checkAlerts(base[j-1].close,base[j].close)}
  D.push(aggBar(nx,rp.i));updLast();stepMAs();Object.keys(IND).forEach(calcInd);status();
}
$('rstep').onclick=step;
$('rplay').onclick=()=>{
  if(rp.timer){clearInterval(rp.timer);rp.timer=null;$('rplay').textContent='▶'}
  else{rp.timer=setInterval(step,+$('rspd').value);$('rplay').textContent='⏸'}
};
function open(side){
  const b=base[rp.i],pr=pip(),sl=+$('slp').value,tp=+$('tpp').value,lots=+$('lot').value;
  if(rp.pos)return;
  if(!(sl>0)){$('rst').textContent='⚠ استاپ‌لاس الزامی است.';return}
  const lim=+$('dlim').value,today=trades.filter(t=>day(t.xt)===day(b.time)).reduce((s,t)=>s+t.pnl,0);
  if(today<=-bal0()*lim/100){$('rst').textContent='🔒 سقف ضرر روزانه فعال شد؛ برای امروز معامله جدید ممکن نیست.';return}
  const d=side==='B'?1:-1;

const smaA=(v,n)=>{const o=[];let s=0;for(let i=0;i<v.length;i++){s+=v[i];if(i>=n)s-=v[i-n];o.push(i>=n-1?s/n:null)}return o};
const emaA=(v,n)=>{const a=2/(n+1);let e=v[0];return v.map((x,i)=>e=i?a*x+(1-a)*e:x)};
function sm(v,n,m){
  if(m==='exp'){const a=2/(n+1),o=[];let e=null;for(let i=0;i<v.length;i++){if(i<n-1){o.push(null);continue}if(e==null){let s=0;for(let j=i-n+1;j<=i;j++)s+=v[j];e=s/n}else e=a*v[i]+(1-a)*e;o.push(e)}return o}
  if(m==='wt'){const den=n*(n+1)/2;return v.map((_,i)=>{if(i<n-1)return null;let s=0;for(let k=0;k<n;k++)s+=v[i-n+1+k]*(k+1);return s/den})}
  return smaA(v,n);
}

 rsi:{s:'RSI',n:'Relative Strength Index',f:[['n','پریود',14],['s','اعمال شود بر','close','sel'],['mg','ادغام در پنجره مشترک',1,'chk']],st:[['سبک','#1f1fdc',4]],lv:[20,90]},

 atr:{s:'ATR',n:'Average True Range',f:[['n','پریود',14],['mg','ادغام در پنجره مشترک',1,'chk']],st:[['سبک','#14b8a6',1]],lv:[]}

function calcIchi(d,p){
  const T=[],K=[],A=[],B=[],C=[],CL=[],tk=[],kj=[],L=d.length;
  const step=L>1?d[L-1].time-d[L-2].time:60,tm=j=>j<L?d[j].time:d[L-1].time+(j-L+1)*step;
  const mid=(i,n)=>{let h=-1e9,l=1e9;for(let j=i-n+1;j<=i;j++){if(d[j].high>h)h=d[j].high;if(d[j].low<l)l=d[j].low}return(h+l)/2};
  for(let i=0;i<L;i++){
    if(i>=p.t-1){tk[i]=mid(i,p.t);T.push({time:d[i].time,value:tk[i]})}
    if(i>=p.k-1){kj[i]=mid(i,p.k)}
    if(i>=p.k-1&&i>=p.t-1){K.push({time:d[i].time,value:kj[i]});A.push({time:tm(i+p.k),value:(tk[i]+kj[i])/2})}
    if(i>=p.b-1&&kj[i]!=null){const b=mid(i,p.b);B.push({time:tm(i+p.k),value:b});CL.push({time:tm(i+p.k),a:(tk[i]+kj[i])/2,b})}
    if(i>=p.k)C.push({time:d[i-p.k].time,value:d[i].close});
  }
  return[T,K,A,B,C,CL];
}
function calcBB(d,p){const n=p.n,M=[],U=[],Lw=[];for(let i=n-1;i<d.length;i++){let s=0,q=0;for(let j=i-n+1;j<=i;j++)s+=d[j].close;const m=s/n;for(let j=i-n+1;j<=i;j++)q+=(d[j].close-m)**2;const sd=Math.sqrt(q/n),t=d[i].time;M.push({time:t,value:m});U.push({time:t,value:m+p.d*sd});Lw.push({time:t,value:m-p.d*sd})}return[M,U,Lw]}
function calcRSI(d,p){const n=p.n,o=[];let ag=0,al=0;for(let i=1;i<d.length;i++){const ch=srcv(d[i],p.s)-srcv(d[i-1],p.s),g=Math.max(ch,0),l=Math.max(-ch,0);if(i<=n){ag+=g/n;al+=l/n;if(i<n)continue}else{ag=(ag*(n-1)+g)/n;al=(al*(n-1)+l)/n}o.push({time:d[i].time,value:al===0?100:100-100/(1+ag/al)})}return[o]}
function calcMACD(d,p){const c=d.map(b=>srcv(b,p.a)),f=emaA(c,p.f),s=emaA(c,p.s),m=f.map((x,i)=>x-s[i]),i0=Math.max(p.f,p.s)-1,mm=m.slice(i0),sg=smaA(mm,p.g),M=[],S=[];mm.forEach((v,i)=>{const t=d[i+i0].time;M.push({time:t,value:v});if(sg[i]!=null)S.push({time:t,value:sg[i]})});return[M,S]}
function calcStoch(d,p){
  const num=[],den=[];
  for(let i=p.k-1;i<d.length;i++){let h=-1e9,l=1e9;for(let j=i-p.k+1;j<=i;j++){const H=p.pf==='lh'?d[j].high:d[j].close,Lo=p.pf==='lh'?d[j].low:d[j].close;if(H>h)h=H;if(Lo<l)l=Lo}num.push(d[i].close-l);den.push(h-l)}
  const sn=smaA(num,p.sl),sd=smaA(den,p.sl),M=[],S=[];
  sn.forEach((v,i)=>{if(v!=null)M.push({time:d[i+p.k-1].time,value:sd[i]>0?100*v/sd[i]:50})});
  const sg=sm(M.map(x=>x.value),p.d,p.m);sg.forEach((v,i)=>{if(v!=null)S.push({time:M[i].time,value:v})});
  return[M,S];
}
function calcATR(d,p){const n=p.n,o=[];let a=0;for(let i=1;i<d.length;i++){const tr=Math.max(d[i].high-d[i].low,Math.abs(d[i].high-d[i-1].close),Math.abs(d[i].low-d[i-1].close));if(i<=n){a+=tr/n;if(i<n)continue}else a=(a*(n-1)+tr)/n;o.push({time:d[i].time,value:a})}return[o]}
const CALC={ichi:calcIchi,bb:calcBB,rsi:calcRSI,macd:calcMACD,stoch:calcStoch,atr:calcATR};

class Cloud{

    let a=0,b=d.length-1;while(a<b){const m=(a+b)>>1;if(d[m].time>=vr.from)b=m;else a=m+1}
    for(let i=Math.max(0,a-1);i<d.length-1;i++){

      x.beginPath();x.moveTo(x1,a1);x.lineTo(x2,a2);x.lineTo(x2,b2);x.lineTo(x1,b1);x.closePath();x.fill();

  else{const pr=base[rp.i].close,d=p.side==='B'?1:-1,pips=(pr-p.entry)*d/pip();trades.push({side:p.side,entry:p.entry,exit:pr,pips:+pips.toFixed(1),pnl:+(pips*PV*h).toFixed(2),xt:base[rp.i].time,why:'½'});save();p.lots=+(p.lots-h).toFixed(2);status();buildTrade()}
}
async function closeAll(){
  if(!rp.on&&MT5.ok){if(!confirm('همه معامله‌ها بسته و سفارش‌های پندینگ لغو شوند؟'))return;try{for(const x of MT5.pos)await mt('/api/close',{ticket:x.ticket});for(const o of MT5.orders)await mt('/api/cancel',{ticket:o.ticket});MTSIG='';flash('همه بسته شد')}catch(e){flash(e.message)}}
  else{if(rp.pos)closePos(base[rp.i].close,'ALL');PEND=[];drawPend();status();buildTrade()}
}
function toggleTrail(){const p=curPos();if(!p||!p.sl){msg('اول SL داشته باشید');return}TRAIL=!TRAIL;TRDIST=Math.max(Math.abs(p.entry-p.sl),(+$('slp').value||20)*PIP);$('ttr').textContent='تریلینگ: '+(TRAIL?'روشن':'خاموش')}
let TRB=false;
function trailTick(price){
  const p=curPos();if(!TRAIL||!p||!p.sl||TRB)return;const d=p.side==='B'?1:-1,ns=price-d*TRDIST;
  if((ns-p.sl)*d>PIP){p.sl=ns;if(p.live){TRB=true;liveModify().finally(()=>TRB=false)}}
}
function baLines(){
  const on=MT5.ok&&!rp.on&&MT5.tick&&SET.ba!==0;
  if(!on){[BLn,ALn].forEach(l=>{if(l)try{candles.removePriceLine(l)}catch(e){}});BLn=ALn=null;return}
  if(!BLn){BLn=candles.createPriceLine({price:MT5.tick.bid,color:'#2563eb',lineWidth:1,lineStyle:3,axisLabelVisible:true,title:'BID'});ALn=candles.createPriceLine({price:MT5.tick.ask,color:'#dc2626',lineWidth:1,lineStyle:3,axisLabelVisible:true,title:'ASK'})}
  else{BLn.applyOptions({price:MT5.tick.bid});ALn.applyOptions({price:MT5.tick.ask})}
}
// لات از ریسک
function autoLot(){
  const d=DRAFT;if(!d)return;if(d.sl==null){msg('اول SL را فعال کنید');return}
  const slp=Math.abs(d.entry-d.sl)/PIP,r=+$('trk').value||1;
  const eq=(!rp.on&&MT5.ok&&MT5.acc)?+MT5.acc.equity:bal0()+trades.reduce((s,t)=>s+t.pnl,0);
  d.lots=Math.max(.01,+(eq*r/100/(slp*PV)).toFixed(2));$('tlot').value=d.lots;$('lot').value=d.lots;
}
// لیست قیمت‌ها
let WT=null;
function openWatch(){
  const dl=$('dlg');dl.innerHTML='<div class="row" style="justify-content:space-between"><button id="dcl">←</button><b>لیست قیمت‌ها</b></div><div id="wl" class="mut">در حال دریافت...</div>';dl.style.display='block';
  const close=()=>{clearInterval(WT);dl.style.display='none'};$('dcl').onclick=close;
  const draw=rows=>{$('wl').innerHTML=rows.map(r=>`<div class="wr" data-s="${r.s}"><b dir="ltr">${r.s}</b><span dir="ltr">${r.v}</span><span dir="ltr" class="${r.c>0?'p':r.c<0?'n':''}">${r.c!=null?r.c.toFixed(2)+'%':''}</span></div>`).join('');$('wl').querySelectorAll('.wr').forEach(x=>x.onclick=()=>{close();loadSymbol(x.dataset.s)})};
  const load=async()=>{try{
    if(MT5.ok){const a=await mt('/api/watch?symbols='+ALLS.map(MT5S).join(','));draw(a.map(r=>({s:r.symbol.slice(0,r.symbol.length-(MT5.suf||'').length),v:r.bid,c:r.chg})))}
    else{const key=localStorage.getItem('td_key');if(!key){$('wl').textContent='برای لیست قیمت، کلید Twelve Data یا اتصال MT5 لازم است.';return}
      const L=ALLS.filter(s=>/^[A-Z]{6}$/.test(s)).slice(0,8),j=await(await fetch('https://api.twelvedata.com/price?symbol='+L.map(s=>s.slice(0,3)+'/'+s.slice(3)).join(',')+'&apikey='+key)).json();
      draw(L.map(s=>{const o=j[s.slice(0,3)+'/'+s.slice(3)];return{s,v:o&&o.price?(+o.price).toFixed(5):'—',c:null}}))}
  }catch(e){$('wl').textContent='خطا: '+e.message}};
  load();WT=setInterval(load,MT5.ok?3000:15000);
}
// پشتیبان‌گیری
function openBackup(){
  const dl=$('dlg');
  dl.innerHTML=`<div class="row" style="justify-content:space-between"><button id="dcl">←</button><b>پشتیبان‌گیری و بازیابی</b></div><p class="mut">ترسیم‌ها، هشدارها، تنظیمات، ژورنال و اندیکاتورها ذخیره می‌شوند. کلید API و توکن MT5 عمداً شامل نمی‌شوند.</p>
<div class="row"><button id="b_cp">کپی در کلیپ‌بورد</button><button id="b_dl">ذخیره فایل</button></div>
<textarea id="b_tx" dir="ltr" style="width:100%;height:110px;font-size:11px" placeholder="برای بازیابی، متن پشتیبان را اینجا بچسبانید"></textarea>
<div class="row"><button id="b_im">بازیابی از متن</button><button id="b_fl">بازیابی از فایل</button></div><input type="file" id="b_f" accept=".json,.txt" style="display:none">`;
  dl.style.display='block';$('dcl').onclick=()=>dl.style.display='none';
  const dump=()=>{const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^(fx_|h_|td_iv|push_)/.test(k)&&k!=='fx_mt5')o[k]=localStorage.getItem(k)}return JSON.stringify({app:'fxchart',v:1,data:o})};
  const restore=t=>{try{const j=JSON.parse(t);if(j.app!=='fxchart')throw 0;Object.keys(j.data).forEach(k=>{if(/^(fx_|h_|td_iv|push_)/.test(k)&&k!=='fx_mt5')localStorage.setItem(k,j.data[k])});location.reload()}catch(e){flash('فایل پشتیبان معتبر نیست')}};
  $('b_cp').onclick=async()=>{const t=dump();$('b_tx').value=t;try{await navigator.clipboard.writeText(t);flash('کپی شد')}catch(e){flash('متن را از کادر کپی کنید')}};
  $('b_dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([dump()],{type:'application/json'}));a.download='fxchart-backup.json';document.body.appendChild(a);a.click();a.remove();$('b_tx').value=dump()};
  $('b_im').onclick=()=>restore($('b_tx').value);
  $('b_fl').onclick=()=>$('b_f').click();$('b_f').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(String(r.result));r.readAsText(f)};
}
// ژورنال (جایگزین)
function renderJ(){
  const n=trades.length,w=trades.filter(t=>t.pnl>0),l=trades.filter(t=>t.pnl<=0);
  const gp=w.reduce((s,t)=>s+t.pnl,0),gl=-l.reduce((s,t)=>s+t.pnl,0);
  let eq=0,pk=0,dd=0;trades.forEach(t=>{eq+=t.pnl;pk=Math.max(pk,eq);dd=Math.max(dd,pk-eq)});
  $('jst').innerHTML=n?`تعداد: ${n} · وین‌ریت: ${(w.length/n*100).toFixed(0)}٪ · امید ریاضی: ${(eq/n).toFixed(2)}$ به ازای هر معامله<br>ضریب سود: ${gl?(gp/gl).toFixed(2):'∞'} · حداکثر دراودان: ${dd.toFixed(2)}$ · جمع: ${eq.toFixed(2)}$`:'هنوز معامله‌ای ثبت نشده. در Replay معامله کنید.';
  let e0=0;const pts=[0].concat(trades.map(t=>e0+=t.pnl)),mx=Math.max(...pts),mn=Math.min(...pts),W=300,H=60;
  const sx=i=>pts.length>1?i*W/(pts.length-1):0,sy=v=>mx===mn?H/2:H-(v-mn)/(mx-mn)*(H-6)-3;
  if($('jeq'))$('jeq').innerHTML=n?`<svg viewBox="0 0 ${W} ${H}" width="100%" height="60"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${pts.map((v,i)=>sx(i).toFixed(1)+','+sy(v).toFixed(1)).join(' ')}"/></svg>`:'';
  $('jtb').innerHTML=trades.map((t,i)=>({t,i})).slice(-30).reverse().map(({t,i})=>`<tr data-i="${i}"><td>${i+1}</td><td>${t.side==='B'?'خرید':'فروش'}</td><td>${t.entry.toFixed(DEC)}</td><td>${t.exit.toFixed(DEC)} ${t.why}</td><td class="${t.pnl>0?'p':'n'}">${t.pips}</td><td class="${t.pnl>0?'p':'n'}">${t.pnl}</td><td>${t.note?'📝':''}</td></tr>`).join('');
}
$('jtb').onclick=e=>{const tr=e.target.closest('tr');if(!tr)return;const t=trades[+tr.dataset.i];if(!t)return;const nt=prompt('یادداشت معامله:',t.note||'');if(nt!==null){t.note=nt;save();renderJ()}};
(()=>{const b=document.createElement('button');b.id='jcsv';b.textContent='خروجی CSV';$('jclr').parentNode.appendChild(b);
  b.onclick=async()=>{const c='side,entry,exit,pips,pnl,reason,time,note\n'+trades.map(t=>[t.side,t.entry,t.exit,t.pips,t.pnl,t.why,fmtT(t.xt),'"'+(t.note||'').replace(/"/g,'""')+'"'].join(',')).join('\n');try{await navigator.clipboard.writeText(c);flash('CSV کپی شد')}catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='journal.csv';a.click()}}})();
// هشدار پیشرفته (جایگزین)
function beep(){if(SET.snd===0)return;try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(s=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start(c.currentTime+s);o.stop(c.currentTime+s+.15)})}catch(e){}}
function fire(a){
  const m='🔔 '+SYM+' → '+a.price.toFixed(DEC),t=$('toast');
  a.on=false;if(a.rep)setTimeout(()=>{a.on=true;saveState();drawAlerts();listAlerts()},60000);
  saveState();drawAlerts();listAlerts();t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',7000);
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}beep();
  try{if(window.Notification&&Notification.permission==='granted')new Notification(m)}catch(e){}
}
function addAlert(pr){pr=+pr;if(!(pr>0))return;try{window.Notification&&Notification.permission==='default'&&Notification.requestPermission()}catch(e){}const a={id:Date.now(),price:pr,on:true,rep:!!($('al_rep')&&$('al_rep').checked)};ALERTS.push(a);srvAlert(a);saveState();drawAlerts();listAlerts()}
function listAlerts(){const l=$('all');if(!l)return;l.innerHTML='';ALERTS.forEach(a=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<span dir="ltr">🔔 ${a.price.toFixed(DEC)}${a.rep?' 🔁':''}</span><span class="mut">${a.on?'فعال':'اجراشده'}</span>`;const d=document.createElement('button');d.textContent='حذف';d.onclick=()=>{srvDel(a);ALERTS=ALERTS.filter(z=>z!==a);saveState();drawAlerts();listAlerts()};r.appendChild(d);l.appendChild(r)})}
(()=>{
  const al=$('al'),r=document.createElement('label');r.className='row';r.innerHTML='<input type="checkbox" id="al_rep"><span class="mut">تکرارشونده (هر ۶۰ ثانیه دوباره فعال شود)</span>';al.insertBefore(r,$('all'));
  const dr=$('dr'),row=document.createElement('div');row.className='row';
  const mkb=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;row.appendChild(b);return b};
  const hb=mkb('مخفی‌کردن ترسیم‌ها',()=>{DR.hide=!DR.hide;hb.textContent=DR.hide?'نمایش ترسیم‌ها':'مخفی‌کردن ترسیم‌ها';drawPrim.rq&&drawPrim.rq()});
  const lb=mkb('قفل ترسیم‌ها',()=>{DR.lock=!DR.lock;lb.textContent=DR.lock?'بازکردن قفل':'قفل ترسیم‌ها'});
  mkb('هشدار روی خط انتخاب‌شده',()=>{const s=DR.items[DR.sel];if(s&&s.k==='hline')addAlert(s.p1);else flash('یک خط افقی را انتخاب کنید')});
  dr.insertBefore(row,dr.lastElementChild);
})();

let ST={};try{ST=JSON.parse(localStorage.getItem('fx_state')||'{}')||{}}catch(e){}
syncTF();
if(ST.cfg)Object.keys(ST.cfg).forEach(n=>{const c=ST.cfg[n];if(CFG[n]&&c&&c.st&&c.st.length===CFG[n].st.length){c.p=Object.assign(mk(n).p,c.p);c.lv=Array.isArray(c.lv)?c.lv:CFG[n].lv;CFG[n]=c}});
const dm=Array.isArray(ST.mas)?ST.mas:[{type:'SMA',n:20,src:'close',color:'#f59e0b',on:true},{type:'EMA',n:50,src:'close',color:'#a855f7',on:true}];
dm.forEach(m=>addMA(m.type,m.n,m.src,m.color));
mas.forEach((m,i)=>{if(dm[i].on===false){m.on=false;m.series.applyOptions({visible:false})}});listMA();
calcRisk();
(ST.ind||[]).forEach(n=>{if(DEFS[n]){onInd(n);IB[n]&&IB[n].classList.add('on')}});
(MT5.url&&MT5.tok?mt5Connect():Promise.resolve()).finally(()=>{const s0=ST.sym||'EURUSD';loadSymbol(MT5.listed&&!ALLS.includes(s0)?ALLS[0]:s0,true)});

</script>
